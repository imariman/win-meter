name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file executable
        run: dotnet publish src/WinMeter/WinMeter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Attach executable to the release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/WinMeter.exe
